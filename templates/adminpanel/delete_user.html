{% extends "base.html" %}

{% block content %}

<div style="
    max-width:550px;
    margin:100px auto;
    padding:40px;
    text-align:center;
    border-radius:25px;
    background:rgba(255,255,255,.10);
    backdrop-filter:blur(25px);
    border:1px solid rgba(255,255,255,.15);
">

    <h1 style="color:#ff7070;">
        ⚠️ Delete User
    </h1>

    <p style="
        color:#dbeafe;
        margin:25px 0;
    ">

        Are you sure you want to permanently
        delete

        <strong>
            {{ user.username }}
        </strong>?

    </p>


    <form method="POST">

        {% csrf_token %}

        <button
            type="submit"
            style="
                padding:14px 25px;
                border:none;
                border-radius:12px;
                background:#dc2626;
                color:white;
                font-weight:700;
                cursor:pointer;
            "
        >

            Yes, Delete

        </button>


        <a
            href="{% url 'admin_users' %}"
            style="
                display:inline-block;
                padding:14px 25px;
                margin-left:10px;
                border-radius:12px;
                background:rgba(255,255,255,.10);
                color:white;
                text-decoration:none;
            "
        >

            Cancel

        </a>

    </form>

</div>

{% endblock %}
